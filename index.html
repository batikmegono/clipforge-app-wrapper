<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClipForge Studio | MOI Apps Studio</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at top,#172a66 0,#081126 45%,#030711 100%);
}

.card{
  width:min(92%,520px);
  padding:36px 26px;
  border-radius:24px;
  text-align:center;
  background:rgba(9,17,42,.92);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 24px 60px rgba(0,0,0,.45);
}

.logo{
  width:76px;
  height:76px;
  margin:0 auto 18px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  background:linear-gradient(135deg,#7258ff,#21d1c3);
}

h1{
  margin:0;
  font-size:30px;
}

.brand{
  margin-top:7px;
  color:#9eabc8;
}

.status{
  display:inline-block;
  margin-top:22px;
  padding:8px 14px;
  border-radius:99px;
  color:#55e6c1;
  background:#0a2e2a;
  border:1px solid #185e53;
  font-size:13px;
}

.desc{
  margin:25px 0;
  color:#c7cee0;
  line-height:1.6;
}

.button{
  display:block;
  width:100%;
  padding:17px;
  border-radius:14px;
  text-decoration:none;
  font-weight:bold;
  font-size:18px;
  color:white;
  background:linear-gradient(90deg,#6558ff,#9a42ff);
  box-shadow:0 10px 28px rgba(105,75,255,.35);
}

.note{
  margin-top:22px;
  font-size:12px;
  color:#75819d;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">✂</div>

  <h1>ClipForge Studio</h1>

  <div class="brand">
    by MOI Apps Studio
  </div>

  <div class="status">
    ● APLIKASI SIAP
  </div>

  <div class="desc">
    Potong video panjang menjadi klip pendek dengan lebih mudah.
    <br><br>
    ClipForge dijalankan menggunakan teknologi Gemini.
  </div>

  <a
    class="button"
    href="https://share.gemini.google/DJec3zIE8Oem">
    🚀 Buka ClipForge
  </a>

  <div class="note">
    Akses pengguna ClipForge Studio • MOI Apps Studio
  </div>

</div>

</body>
