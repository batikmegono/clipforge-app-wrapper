<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClipForge Studio | MOI Apps Studio</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050816;
    color:white;
}

/* HEADER */
.topbar{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;

    background:
    linear-gradient(
        90deg,
        #071126,
        #121941
    );

    border-bottom:
    1px solid #273354;

    position:relative;
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:900;
}

.logo{
    width:36px;
    height:36px;
    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
        135deg,
        #7058ff,
        #24d3c2
    );

    font-size:20px;
}

.brand-text{
    line-height:1.1;
}

.brand-text small{
    display:block;
    font-size:10px;
    color:#98a5bd;
    font-weight:normal;
    margin-top:4px;
}

/* STATUS */
.status{
    font-size:11px;
    padding:7px 11px;
    border-radius:50px;

    background:#0c2530;
    border:1px solid #17534e;
    color:#61e1ce;
}

/* AREA APP */
.app-area{
    width:100%;
    height:calc(100vh - 58px);
    position:relative;
    background:#fff;
}

/* GEMINI IFRAME */
iframe{
    border:0;
    width:100%;
    height:100%;
    display:block;
    background:white;
}

/* LOADING */
.loading{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050816;

    z-index:10;

    transition:
    opacity .3s ease;
}

.loading.hide{
    opacity:0;
    pointer-events:none;
}

.loader-box{
    text-align:center;
}

.spinner{
    width:45px;
    height:45px;

    border:
    4px solid #26304b;

    border-top-color:
    #775dff;

    border-radius:50%;

    margin:auto;

    animation:
    spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:
        rotate(360deg);
    }
}

.loading h3{
    margin-bottom:5px;
}

.loading p{
    color:#9ca8bd;
    font-size:13px;
}

/* FALLBACK */
.fallback{
    display:none;

    position:absolute;
    left:50%;
    bottom:18px;

    transform:
    translateX(-50%);

    z-index:30;

    background:#10192d;

    border:
    1px solid #34415e;

    padding:
    10px 14px;

    border-radius:12px;

    box-shadow:
    0 7px 25px rgba(0,0,0,.4);

    text-align:center;
}

.fallback.show{
    display:block;
}

.fallback p{
    margin:
    0 0 8px;

    font-size:12px;

    color:#aab4c8;
}

.fallback a{
    display:inline-block;

    padding:
    9px 15px;

    background:
    linear-gradient(
        90deg,
        #7057ff,
        #9942ff
    );

    color:white;

    text-decoration:none;

    border-radius:9px;

    font-size:13px;

    font-weight:bold;
}

/* MOBILE */
@media(max-width:600px){

    .topbar{
        height:54px;
        padding:
        0 11px;
    }

    .app-area{
        height:
        calc(
        100vh - 54px
        );
    }

    .brand{
        font-size:13px;
    }

    .logo{
        width:32px;
        height:32px;
    }

    .status{
        font-size:9px;
        padding:
        6px 8px;
    }

}
</style>
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="logo">
            ✂
        </div>

        <div class="brand-text">

            ClipForge Studio

            <small>
                by MOI Apps Studio
            </small>

        </div>

    </div>


    <div class="status">
        ● ONLINE
    </div>

</header>


<main class="app-area">


    <div
    class="loading"
    id="loading">

        <div class="loader-box">

            <div class="spinner">
            </div>

            <h3>
                Membuka ClipForge
            </h3>

            <p>
                Menyiapkan aplikasi...
            </p>

        </div>

    </div>


    <iframe
        id="geminiApp"

        src="https://share.gemini.google/DJec3zIE8Oem"

        allow="
        clipboard-read;
        clipboard-write;
        microphone;
        camera
        "

        referrerpolicy="
        strict-origin-when-cross-origin
        "

        onload="
        iframeLoaded()
        ">
    </iframe>


    <div
    class="fallback"
    id="fallback">

        <p>
            Jika aplikasi tidak tampil,
            buka langsung di Gemini.
        </p>

        <a
        href="https://share.gemini.google/DJec3zIE8Oem"
        target="_self">

            Buka ClipForge

        </a>

    </div>


</main>


<script>

const loading =
document.getElementById(
    "loading"
);

const fallback =
document.getElementById(
    "fallback"
);


/* iframe berhasil load */
function iframeLoaded(){

    setTimeout(
        function(){

            loading.classList.add(
                "hide"
            );

        },
        1200
    );

}


/*
Karena Gemini dapat
melarang iframe,
setelah beberapa detik
tampilkan tombol cadangan.
*/

setTimeout(
    function(){

        fallback.classList.add(
            "show"
        );

    },
    6000
);


/*
Kalau aplikasi tampil normal,
tombol cadangan tetap kecil
di bawah.

Kalau Gemini memblokir iframe,
pengguna masih dapat membuka
aplikasinya lewat tombol ini.
*/

</script>

</body>
</html>
